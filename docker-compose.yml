services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: stellardrop
      POSTGRES_PASSWORD: stellardrop
      POSTGRES_DB: stellardrop
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stellardrop -d stellardrop"]
      interval: 5s
      timeout: 5s
      retries: 10
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
volumes:
  postgres_data:
