[build]
  command = "npm run db:generate && npm run build"
  publish = "apps/web/.next"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "24"
  NODE_ENV = "production"
  NPM_FLAGS = "--include=dev"
  # Browser requests use this site's /api routes.
  NEXT_PUBLIC_API_URL = ""
  SECRETS_SCAN_OMIT_KEYS = "ANCHOR_HOME_DOMAIN,ANCHOR_POLL_INTERVAL_MS,NETWORK_PASSPHRASE,NODE_ENV,PORT,STELLAR_HORIZON_URL,TELEGRAM_BOT_USERNAME,TELEGRAM_MODE,USDC_ISSUER,WEB_ORIGIN"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@prisma/client", "@stellar/stellar-sdk", "express", "nodemailer", "pg", "pino", "telegraf"]
  included_files = ["node_modules/.prisma/client/**", "prisma/supabase-ca.crt"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/health"
  to = "/.netlify/functions/api/health"
  status = 200
  force = true
